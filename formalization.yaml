    authors:
      - "Alexandr Kostochka"
      - "Matthew Yancey"
    id: "arXiv:1209.1173"
    type: "paper"
    location: "Combinatorica 34 (2014), no. 3, 323–329; https://arxiv.org/abs/1209.1173"
    relationship: "formalizes"
    note: >-
      Section 2 (Theorem 4 and Claims 8–13, discharging) is formalized; the potential
      bookkeeping is reproduced with a strengthened minimality hypothesis (a smaller
      non-3-colourable graph has a vertex set of potential at most 2 spanning a
      non-3-colourable subgraph, which is what the paper uses through 4-critical subgraphs).
      Section 3 (deduction of Grötzsch's theorem) is formalized, except that the planar
      "crossing paths" step is replaced by an argument with a K5 minor, using a combinatorial
      notion of planarity instead of a topological one.
    license: "unknown"
    author_endorsement: "not-contacted"
