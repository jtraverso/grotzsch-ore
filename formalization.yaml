# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Grötzsch's theorem, Ore's conjecture for k = 4 (Kostochka–Yancey) and the Grünbaum–Aksenov theorem"
  description: >-
    A Lean 4 / Mathlib formalization of results on 3-colourings of planar graphs. (1) Kostochka
    and Yancey's theorem, the case k = 4 of Ore's 1967 conjecture on the minimum number of edges
    of k-critical graphs: every finite 4-critical graph G satisfies 3|E(G)| ≥ 5|V(G)| - 2, by
    their potential method. (2) Grötzsch's theorem: every finite triangle-free planar graph is
    3-colourable, deduced from (1) as in Kostochka–Yancey, with the topological crossing
    argument replaced by a K5-minor argument with an apex inside a face. (3) Aksenov's and
    Jensen–Thomassen's theorem: a triangle-free planar graph plus one edge is 3-colourable
    (Borodin–Kostochka–Lidický–Yancey, Theorem 2). (4) A triangle-free planar graph plus one
    vertex of degree at most 4 is 3-colourable (BKLY, Theorem 4). (5) The Grünbaum–Aksenov
    theorem: every finite planar graph with at most three triangles is 3-colourable, following
    BKLY's short proof (Theorem 7), with precolouring extension for 4- and 5-cycles (BKLY
    Theorem 5, for arbitrary cycles) and a combinatorial region (Jordan-type) theorem for
    rotation systems making the interiors and outer faces of the paper precise. Planarity is
    defined combinatorially, by rotation systems of genus zero (Euler defect 0); as sanity checks
    on this definition K4 is shown planar and K5 and K3,3 non-planar.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C10", "05C35"]

sources:
