    relationship: "formalizes"
    note: >-
      Theorems 2, 4 and 7 (Grünbaum–Aksenov) are formalized, and Theorem 5 in the stronger form
      "every proper 3-colouring of any 4- or 5-cycle of a triangle-free planar graph extends"
      (not only of faces), proved from Theorems 2 and 4 without faces. Lemma 10 and Cases 1–3 of
      the proof of Theorem 7 are formalized; the topological steps (crossing paths, interiors and
      exteriors of separating cycles, the outer 5-face) are replaced by K5-minor arguments and by
      a combinatorial region theorem for rotation systems proved here.
    license: "unknown"
    author_endorsement: "not-contacted"
