related_formalizations:
  - id: "LeanPool/K5MinorFreeChoosability (planar list-colouring development by the same author, not yet published)"
    relationship: "builds-on"
    note: >-
      The combinatorial planarity library (plane maps, Euler's formula, face lengths,
      minor-closedness, non-planarity of K5 and K3,3, apex extension inside a face) is the
      author's own earlier development; the 22 modules needed here are included verbatim in this
      repository under LeanPool/K5MinorFreeChoosability. The developments under Grotzsch/ are new.

status:
  scope: >-
    Proved for finite simple graphs: Kostochka–Yancey's bound 3|E| ≥ 5|V| - 2 for 4-critical
    graphs, BKLY Theorems 2 and 4 and the Grünbaum–Aksenov theorem (vertex type in `Type`),
    Grötzsch's theorem (vertex type in any universe), planarity of K4 and non-planarity of K5 and
    K3,3. Planarity means the existence of a genus-zero rotation system; its equivalence with
    topological embeddability in the sphere is classical but not formalized. The general Ore
    conjecture (k ≥ 5) and the general Kostochka–Yancey bound are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        AI-assisted. The human author chose the theorems, the proof routes (Kostochka–Yancey,
        Borodin–Kostochka–Lidický–Yancey) and the reuse of the author's own planarity library,
        and directed the work. The agent designed the formal architecture (statements of all
        claims, the minimal-counterexample structures, the K5-minor replacements of the crossing
        arguments, the precolouring-extension gadgets, the region theorem and the combinatorial
        version of the case analysis of Theorem 7), wrote the remaining proofs (planar part of
        Grötzsch, precolouring extension, separator reductions and Case 1 of Grünbaum–Aksenov,
        Lemma 10, assembly, packaging), tested intermediate claims numerically with the certo
        toolkit (sweeps over all small planar graphs, with a negative control on the torus), and
        checked everything with `lake build` and `#print axioms` (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about three working days"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish; proof plans proposed by the agent and approved by the author."
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Used to fill proofs from formal statements and detailed proof plans: the
        Kostochka–Yancey claims (Grotzsch/Ore.lean); BKLY Theorems 4 and 2
        (Grotzsch/PlusVertex.lean, Grotzsch/PlusEdge.lean); the facial-cycle theorem
        (Grotzsch/FacialCycle.lean); the region theorem (Grotzsch/Regions.lean); Case 2, the
        crossing lemma and the identification step of Grünbaum–Aksenov (Grotzsch/GACases.lean);
        Cases 3.1 and 3.2 (Grotzsch/GACase3.lean). All returned files were audited against the
        submitted commit: only the assigned `sorry`s were filled, no statement changed, no other
        file was taken over, and the results were rebuilt and axiom-checked locally.
      cost:
        wall_time: "about a day of compute (ten runs)"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Each run received the skeleton file, the relevant part of the paper and a step-by-step proof plan."
  spend_usd: "subscription-based"
  notes: >-
    Statements were fixed first (skeletons with `sorry`), then filled; every step was verified
    mechanically (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, and
    identical elaborated types for each Challenge/Solution pair).

fidelity:
  divergences: >-
    Planarity is the combinatorial notion (genus-zero rotation system), not a topological
    embedding; the classical equivalence is not formalized. The topological steps of the papers
    (two paths joining opposite corners of a 4-face must cross; interiors and exteriors of
    separating 4- and 5-cycles; the outer face) are replaced by K5-minor arguments and by a
    combinatorial region theorem for rotation systems. The Kostochka–Yancey bound, BKLY
    Theorems 2 and 4 and the Grünbaum–Aksenov theorem are stated for vertex types in `Type`
    (universe 0); Grötzsch's theorem for arbitrary universes. 4-critical means not 3-colourable
    and every vertex-deleted and every edge-deleted subgraph is 3-colourable. A triangle is a
    3-element vertex set inducing a clique (`IsNClique 3`); the degree bound of Theorem 4 is
    stated as `Nat.card (H.neighborSet v) ≤ 4`.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    Statements were audited by the agent against the sources; the Aristotle-generated proofs
    were audited by diff (statements unchanged, no extra options or axioms) and rebuilt. No
    independent human mathematical review has been performed yet.

alignment:
  namespace: "GrotzschKY"
  statements:
    - source: "Grötzsch (1959); Kostochka–Yancey (2014), Theorem 3"
      lean: "GrotzschKY.grotzsch"
      module: "Challenge"
      status: "proved"
      note: "Every finite triangle-free planar graph is 3-colourable (planarity by rotation systems)."
    - source: "Kostochka–Yancey (2014), Theorem 4 (Ore's conjecture for k = 4)"
      lean: "GrotzschKY.ore_four"
      module: "Challenge"
      status: "proved"
      note: "5|V| ≤ 3|E| + 2 for every finite 4-critical graph."
    - source: "Aksenov (1974); Jensen–Thomassen (2000); BKLY (2014), Theorem 2"
      lean: "GrotzschKY.colorable_of_planar_add_edge"
      module: "Challenge"
      status: "proved"
      note: "If deleting the edge uv from H leaves a triangle-free planar graph, H is 3-colourable."
    - source: "Borodin–Kostochka–Lidický–Yancey (2014), Theorem 4"
      lean: "GrotzschKY.colorable_of_planar_add_vertex"
      module: "Challenge"
      status: "proved"
      note: "If H - v is triangle-free planar and v has at most four neighbours, H is 3-colourable."
    - source: "Grünbaum (1963); Aksenov (1974); BKLY (2014), Theorem 7"
      lean: "GrotzschKY.grunbaum_aksenov"
      module: "Challenge"
      status: "proved"
      note: "Every finite planar graph with at most three triangles is 3-colourable."
    - source: "Sanity check of the planarity definition"
      lean: "GrotzschKY.isPlanar_K4"
      module: "Challenge"
      status: "proved"
      note: "K4 is planar."
    - source: "Sanity check of the planarity definition (Kuratowski graphs)"
      lean: "GrotzschKY.not_isPlanar_K5"
      module: "Challenge"
      status: "proved"
      note: "K5 is not planar."
    - source: "Sanity check of the planarity definition (Kuratowski graphs)"
      lean: "GrotzschKY.not_isPlanar_K33"
      module: "Challenge"
      status: "proved"
      note: "K3,3 is not planar."

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle for the proofs listed above.
